[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/master",
    "crates/worker",
    "crates/cli",
    "crates/android_bridge",
    "crates/agent_mesh",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["The OxideSwarm Authors"]
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.91"

[workspace.dependencies]
# Internal workspace crates
agent_mesh = { path = "crates/agent_mesh" }
rusty_grid_core = { path = "crates/core" }
rusty_grid_master = { path = "crates/master" }
rusty_grid_worker = { path = "crates/worker" }

# Asynchronous runtime & networking
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.10"
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots", "url"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

# Serialization & wire protocol
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
uuid = { version = "1.11", features = ["v4", "serde"] }

# Error handling
thiserror = "2.0"

# Logging & observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI parsing & time utilities
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1.2"

# System monitoring
sysinfo = "0.30"

# Embedded P2P NAT Traversal
iroh = { version = "1.2", default-features = false, features = ["tls-ring", "portmapper"] }

[profile.dev]
opt-level = 0
# Line tables keep file:line in panics and backtraces. Full debug info (`debug = true`) is the
# largest part of `target/` that a setting can remove, because each integration test is its own
# binary. CI uses the same value. Set `CARGO_PROFILE_DEV_DEBUG=true` for a session that needs
# variables in a debugger.
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

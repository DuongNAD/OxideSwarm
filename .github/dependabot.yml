version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # bincode is the positional wire encoding (format byte 0x02). Any version change alters the
      # bytes on the wire and needs a protocol version bump (docs/design/0040-protocol-versioning.md,
      # BACKLOG FEAT-8). 3.0.0 is a placeholder that only contains compile_error!, and
      # RUSTSEC-2025-0141 marks the crate unmaintained (1.3.3 is called complete). Migrate by hand.
      - dependency-name: "bincode"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # The Rust toolchain is pinned on purpose: CLAUDE.md asks to run clippy locally on a new
      # version first, then bump every job at once. The action's version is the Rust version, and
      # Dependabot proposes tags such as 1.120.0 that are not Rust releases (stable is 1.99.x).
      - dependency-name: "dtolnay/rust-toolchain"

name: Release

# On a `v*` tag this builds release archives for Linux, macOS and Windows (with and without
# `gpu-wgpu`), writes SHA256SUMS, attests the build provenance of every archive and creates the
# GitHub release. On a pull request that touches this file or the dependency manifests it runs the
# same build and packaging and keeps the files as workflow artifacts only: no tag, no release.
#
# A manual run (`gh workflow run release.yml --ref <branch> -f mode=attest-only`) builds, writes
# SHA256SUMS and attests, and creates no release: the publish job runs only for a pushed `v*` tag,
# and `attest-only` is the only mode. It checks the attestation step without a tag (LV-5). Its
# attestations stay in the repository and name the branch and commit of the run.
#
# Verify an archive: `gh attestation verify <ARCHIVE> --repo DuongNAD/OxideSwarm` (README, Install).

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      mode:
        description: 'attest-only: build, write SHA256SUMS and attest the archives; never create a release'
        type: choice
        options: [attest-only]
        default: attest-only
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build (${{ matrix.target }}${{ matrix.gpu && ' gpu' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,      target: x86_64-unknown-linux-gnu,  gpu: false }
          - { os: ubuntu-22.04,      target: x86_64-unknown-linux-gnu,  gpu: true }
          - { os: macos-latest,     target: aarch64-apple-darwin,      gpu: false }
          - { os: macos-latest,     target: aarch64-apple-darwin,      gpu: true }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       gpu: false }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       gpu: true }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    gpu: false }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    gpu: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}-${{ matrix.gpu }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)-pr${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          features=()
          if [ "${{ matrix.gpu }}" = "true" ]; then features=(--features gpu-wgpu); fi
          cargo build --release --locked --target "${{ matrix.target }}" -p rusty_grid_cli --bins "${features[@]}"

      - name: Package
        id: pkg
        run: |
          name="oxideswarm-${{ steps.ver.outputs.version }}-${{ matrix.target }}"
          if [ "${{ matrix.gpu }}" = "true" ]; then name="${name}-gpu"; fi
          bindir="target/${{ matrix.target }}/release"
          stage="dist/${name}"
          mkdir -p "${stage}" "dist/out"
          case "${{ matrix.target }}" in
            *windows*)
              ext=zip; exe=.exe
              installers=(packaging/windows windows)
              ;;
            *apple-darwin)
              ext=tar.gz; exe=
              installers=(packaging/macos switch_role.sh connect_remote.sh)
              ;;
            *)
              ext=tar.gz; exe=
              installers=(switch_role.sh connect_remote.sh)
              ;;
          esac
          for b in oxideswarm rusty-grid ox-mode; do cp "${bindir}/${b}${exe}" "${stage}/"; done
          cp README.md LICENSE LICENSE-MIT LICENSE-APACHE "${stage}/"
          mkdir -p "${stage}/scripts"
          for i in "${installers[@]}"; do cp -R "$i" "${stage}/scripts/"; done
          if [ "$ext" = zip ]; then
            (cd dist && 7z a -tzip "out/${name}.zip" "${name}" > /dev/null)
          else
            tar -C dist -czf "dist/out/${name}.tar.gz" "${name}"
          fi
          ls -l dist/out
          echo "archive=${name}.${ext}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: dist/out/${{ steps.pkg.outputs.archive }}
          if-no-files-found: error
          retention-days: 14

  # Holds the final archives: writes SHA256SUMS and attests the build provenance of every archive
  # (LV-5). The two write permissions below are the only ones in this workflow besides the publish
  # job's `contents: write`: `id-token` for the Sigstore signing certificate, `attestations` to store
  # the attestation in the repository.
  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: archives
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: archives
        run: |
          sha256sum oxideswarm-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      # One signed SLSA build provenance attestation whose subjects are all archives. A pull request
      # from a fork gets no id-token, so the step is skipped there.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'archives/oxideswarm-*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHA256SUMS
          path: archives/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          gh release create "${GITHUB_REF_NAME}" assets/* --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag

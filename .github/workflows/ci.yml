name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly run so that RustSec advisories published against an unchanged Cargo.lock still show up
  # and the ignored live Iroh DERP relay P2P tests run against the public relay network.
  # Only the audit and p2p-wan-relay jobs run on the schedule.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run; runs for pushes to master are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# The toolchain is pinned (`dtolnay/rust-toolchain@<version>`) so that a new stable release and its
# new lints cannot turn CI red on an unchanged tree. Bump it in every job at once, deliberately,
# after running `cargo clippy --workspace --all-targets -- -D warnings` locally on the new version.

jobs:
  fmt:
    name: rustfmt
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Each OS compiles its own cfg-gated code (process groups, Job Objects, PR_SET_PDEATHSIG).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --features 3d --locked -- -D warnings
      - name: master compiles without default features (dashboard, p2p)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p rusty_grid_master --no-default-features --locked

  gpu-wgpu:
    name: gpu-wgpu (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - run: cargo clippy -p rusty_grid_cli --all-targets --features gpu-wgpu --locked -- -D warnings
      - run: cargo test -p rusty_grid_cli --lib --features gpu-wgpu --locked

  test:
    # Workspace unit tests (`cargo test --workspace --lib`), `agent_mesh` sandbox integration tests
    # (`test_sec6_mesh_sandbox`), and Rust hub + Python agent interop suites (`test_agent_mesh_rust_hub_cross_interop.py`).
    name: unit tests (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check websockets
      - name: verify wire_layout.txt version bump against baseline
        env:
          WIRE_LAYOUT_BASELINE_REF: refs/remotes/ci/wire-layout-base
        run: |
          git fetch --no-tags --depth=1 origin "+${{ (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.base_ref || 'master' }}:refs/remotes/ci/wire-layout-base"
          cargo test -p rusty_grid_core --lib wire_layout_tests::wire_layout_file_bumps_version_when_body_differs_from_origin_master --locked -- --exact
      - run: cargo test --workspace --lib --locked
      - name: run 3d feature unit and integration tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --workspace --lib --features 3d --locked
          cargo test -p rusty_grid_worker --features 3d --locked --test test_3d1_honest_sdf --test test_autorig_adversarial_stress --test test_autorig_pipeline --test test_challenger_m3_blender_job_object --test test_gen3d_adversarial_stress --test test_gen3d_pipeline
          cargo test -p rusty_grid_cli --features 3d --locked --test test_cli_3d_submission --test test_3d_autorig_pipeline --test test_challenger_m5_3d_pipeline
          cargo test -p agent_mesh --features 3d --locked --test test_challenger_m4_mesh_tampering_and_burst --test test_ecosystem_convergence
      - name: run agent mesh integration tests
        run: cargo test -p agent_mesh --test test_sec6_mesh_sandbox --locked
      - name: build agent mesh hub binary for Python interop suites
        run: cargo build -p agent_mesh --locked
      - name: run Rust hub + Python agent interop suites
        run: python tests/test_agent_mesh_rust_hub_cross_interop.py

  workspace-test:
    # Full Cargo workspace test suite (`tests/` and `crates/*/tests/` included).
    # Tests bind 127.0.0.1:0 and give child processes a temporary HOME, so they need no fixed ports
    # and never touch the runner's ~/.oxideswarm.
    name: workspace tests (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Design 0033 (FEAT-3b): on Linux the isolation tests fail, instead of skipping, when the
      # runner kernel has no Landlock.
      RUSTY_GRID_REQUIRE_LANDLOCK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      # tests/test_ecosystem_convergence.rs runs scripts/agent_node.py (as `python3`, or `python` on
      # Windows), which needs the `websockets` package.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: python -m pip install websockets
        run: python -m pip install --disable-pip-version-check websockets
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - run: cargo test --workspace --locked --no-fail-fast
      # Design 0033 (FEAT-3b): the workspace run above is the restricted-userns case of
      # `ubuntu-latest` (AppArmor lets `unshare` succeed without capabilities); this run has the
      # restriction off, so the private network namespace and its id map are exercised too.
      - name: isolation tests with unprivileged user namespaces allowed
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          RUSTY_GRID_REQUIRE_USERNS=1 cargo test -p rusty_grid_worker --test test_feat3_os_isolation --locked

  sec5-hardened-runner:
    name: sec5 hardened runner (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - run: cargo test -p rusty_grid_worker --test test_sec5_hardened_runner --locked
      - run: cargo test -p rusty_grid_worker --test test_sec5_hardened_runner --features 3d --locked

  launcher-scripts:
    name: launcher scripts (${{ matrix.os }})
    if: github.event_name != 'schedule'
    # tests/test_launcher_scripts.py globs the whole checkout, target/ included, and gets slow once a
    # target/ directory exists. Keep cargo and rust-cache out of this job so that the script always runs
    # without any build: it runs the launchers against fake binaries.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: python3 tests/test_launcher_scripts.py
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # The launchers must work with macOS's own /bin/bash 3.2: run them with it, not with a newer
            # Homebrew bash that may come first on the runner's PATH.
            export PATH="/bin:$PATH"
          fi
          bash -c 'echo "bash $BASH_VERSION ($(command -v bash))"'
          python3 --version
          python3 tests/test_launcher_scripts.py

  agent-bridge:
    # The bridge also runs on the owner's Windows machine, and this is the only check of that path.
    name: agent bridge (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check websockets
      - run: python tests/test_agent_bridge.py
      - run: python tests/test_launcher_scripts.py
      - run: python tests/test_m1_challenger_hygiene.py
      - name: run agent mesh test suite
        run: python tests/run_mesh_simulation_tests.py

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; "unmaintained" notices (bincode 1.x, paste) are reported as warnings.
      - run: cargo audit

  p2p-wan-relay:
    name: p2p wan relay (ignored)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test -p rusty_grid_cli --test test_p2p_wan_fallback --locked -- --ignored

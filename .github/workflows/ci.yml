name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly run so that RustSec advisories published against an unchanged Cargo.lock still show up
  # and the ignored live Iroh DERP relay P2P tests run against the public relay network.
  # Only the audit, p2p-wan-relay, endurance, fuzz and miri jobs run on the schedule.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run; runs for pushes to master are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# The toolchain is pinned (`dtolnay/rust-toolchain@<commit> # <version>`, the commit of the action's
# `<version>` branch) so that a new stable release and its new lints cannot turn CI red on an
# unchanged tree. Bump it in every job at once, deliberately, after running
# `cargo clippy --workspace --all-targets -- -D warnings` locally on the new version; the commit is
# `gh api repos/dtolnay/rust-toolchain/commits/<version> --jq .sha`.
#
# Every `uses:` names a full commit, with its tag in a comment (LV-5): a moved tag cannot change what
# CI runs. Dependabot (`.github/dependabot.yml`, ecosystem `github-actions`) proposes new commits.

jobs:
  fmt:
    name: rustfmt
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Each OS compiles its own cfg-gated code (process groups, Job Objects, PR_SET_PDEATHSIG).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --features 3d --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --features otel --locked -- -D warnings
      - name: Rust source file size check (production part at most 3,000 lines, design 0080)
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --locked -p rusty_grid_cli --bin ox-mode -- test size
      - name: master compiles without default features (dashboard, p2p)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p rusty_grid_master --no-default-features --locked
      - name: android bridge compiles for aarch64-linux-android
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add aarch64-linux-android
          TOOLCHAIN="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG_BIN="${TOOLCHAIN}/bin/aarch64-linux-android24-clang"
          AR_BIN="${TOOLCHAIN}/bin/llvm-ar"
          export CC_aarch64_linux_android="${CLANG_BIN}"
          export AR_aarch64_linux_android="${AR_BIN}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${CLANG_BIN}"
          test -x "${CLANG_BIN}" && test -x "${AR_BIN}" || { echo "NDK toolchain not found under ${TOOLCHAIN}"; exit 1; }
          cargo check -p rusty_grid_android_bridge --target aarch64-linux-android --locked

  gpu-wgpu:
    name: gpu-wgpu (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - run: cargo clippy -p rusty_grid_cli --all-targets --features gpu-wgpu --locked -- -D warnings
      - run: cargo test -p rusty_grid_cli --lib --features gpu-wgpu --locked

  test:
    # Workspace unit tests (`cargo test --workspace --lib`), `agent_mesh` sandbox integration tests
    # (`test_sec6_mesh_sandbox`), and Rust hub + Python agent interop suites (`test_agent_mesh_rust_hub_cross_interop.py`).
    name: unit tests (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check websockets
      - name: verify wire_layout.txt version bump against baseline
        env:
          WIRE_LAYOUT_BASELINE_REF: refs/remotes/ci/wire-layout-base
        run: |
          git fetch --no-tags --depth=1 origin "+${{ (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.base_ref || 'master' }}:refs/remotes/ci/wire-layout-base"
          cargo test -p rusty_grid_core --lib wire_layout_tests::wire_layout_file_bumps_version_when_body_differs_from_origin_master --locked -- --exact
      - run: cargo test --workspace --lib --locked
      - name: run 3d feature unit and integration tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --workspace --lib --features 3d --locked
          cargo test -p rusty_grid_worker --features 3d --locked --test test_3d1_honest_sdf --test test_autorig_adversarial_stress --test test_autorig_pipeline --test test_challenger_m3_blender_job_object --test test_gen3d_adversarial_stress --test test_gen3d_pipeline
          cargo test -p rusty_grid_cli --features 3d --locked --test test_cli_3d_submission --test test_3d_autorig_pipeline --test test_challenger_m5_3d_pipeline
          cargo test -p agent_mesh --features 3d --locked --test test_challenger_m4_mesh_tampering_and_burst --test test_ecosystem_convergence
      - name: run otel feature unit and integration tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test -p rusty_grid_master --lib --features otel --locked
          cargo test -p rusty_grid_cli --lib --features otel --locked
          cargo test -p rusty_grid_master --test observability_metrics_otel_test --features otel,test-hooks --locked
      - name: run agent mesh integration tests
        run: cargo test -p agent_mesh --test test_sec6_mesh_sandbox --locked
      - name: build agent mesh hub binary for Python interop suites
        run: cargo build -p agent_mesh --locked
      - name: run Rust hub + Python agent interop suites
        run: python tests/test_agent_mesh_rust_hub_cross_interop.py
      - name: build CLI and agent mesh binaries for Wave 2 E2E tests
        if: matrix.os != 'windows-latest'
        run: cargo build -p rusty_grid_cli -p agent_mesh --locked
      - name: run Wave 2 E2E tests
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          TMPISO="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/oxs_e2e.XXXXXX")"
          trap 'rm -rf "$TMPISO"' EXIT
          chmod 700 "$TMPISO"
          mkdir -p "$TMPISO/bin" "$TMPISO/home" "$TMPISO/tmp"
          printf '#!/bin/sh\necho "Now drawing from '\''AC Power'\''"\nexit 0\n' > "$TMPISO/bin/pmset"
          chmod 755 "$TMPISO/bin/pmset"
          REAL_RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          REAL_CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          RUSTUP_HOME="$REAL_RUSTUP_HOME" CARGO_HOME="$REAL_CARGO_HOME" \
            HOME="$TMPISO/home" USERPROFILE="$TMPISO/home" TMPDIR="$TMPISO/tmp" PATH="$TMPISO/bin:$PATH" \
            RUSTY_GRID_NO_BATTERY=1 OXIDESWARM_PROFILE=debug \
            python3 -m unittest tests/test_wave2_e2e.py -v
      - name: build CLI (--features 3d) and agent mesh binaries for Wave 3 E2E tests
        if: matrix.os != 'windows-latest'
        run: |
          cargo build -p rusty_grid_cli --bin oxideswarm --features 3d --locked
          cargo build -p agent_mesh --bin agent-mesh --locked
      - name: run Wave 3 E2E tests
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          TMPISO="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/oxs_e2e.XXXXXX")"
          trap 'rm -rf "$TMPISO"' EXIT
          chmod 700 "$TMPISO"
          mkdir -p "$TMPISO/bin" "$TMPISO/home" "$TMPISO/tmp"
          printf '#!/bin/sh\necho "Now drawing from '\''AC Power'\''"\nexit 0\n' > "$TMPISO/bin/pmset"
          chmod 755 "$TMPISO/bin/pmset"
          REAL_RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          REAL_CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          RUSTUP_HOME="$REAL_RUSTUP_HOME" CARGO_HOME="$REAL_CARGO_HOME" \
            HOME="$TMPISO/home" USERPROFILE="$TMPISO/home" TMPDIR="$TMPISO/tmp" PATH="$TMPISO/bin:$PATH" \
            RUSTY_GRID_NO_BATTERY=1 RUSTY_GRID_DISABLE_DISCOVERY=1 RUSTY_GRID_P2P_MINIMAL=1 \
            OXIDESWARM_PROFILE=debug OXIDESWARM_E2E_TIER=all PYTHONDONTWRITEBYTECODE=1 \
            python3 -B -m unittest tests/test_wave3_e2e.py -v

  workspace-test:
    # Full Cargo workspace test suite (`tests/` and `crates/*/tests/` included).
    # Tests bind 127.0.0.1:0 and give child processes a temporary HOME, so they need no fixed ports
    # and never touch the runner's ~/.oxideswarm.
    name: workspace tests (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Design 0033 (FEAT-3b / FEAT-3c): on Linux and Windows the isolation tests fail, instead of
      # skipping, when the runner lacks Landlock or AppContainer / required host preconditions.
      RUSTY_GRID_REQUIRE_LANDLOCK: "1"
      RUSTY_GRID_REQUIRE_APPCONTAINER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
      # tests/test_ecosystem_convergence.rs runs scripts/agent_node.py (as `python3`, or `python` on
      # Windows), which needs the `websockets` package.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: python -m pip install websockets
        run: python -m pip install --disable-pip-version-check websockets
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - name: Windows AppContainer isolation tests (--test-threads=1 --nocapture)
        if: matrix.os == 'windows-latest'
        run: cargo test -p rusty_grid_worker --test test_feat3_os_isolation --locked -- --test-threads=1 --nocapture
      # TEST-29: windows-latest twice lost its runner at the 60-minute mark here, with no log left.
      # The step stops at 45 minutes, so the job ends (and keeps its log) before that mark; the wrapper
      # prints a heartbeat line with the last output line once a minute and keeps a copy of the output
      # for the diagnostics step below. The command and what it tests are unchanged; TEST-56 sets
      # step-scoped RUSTY_GRID_SKIP_FEAT3_OS_ISOLATION_STEP8=1 only here on Windows so the 30 tests
      # already run serially in the step above print a skip notice while any newly added target or
      # test function still compiles and runs.
      - name: cargo test --workspace --locked --no-fail-fast
        timeout-minutes: 45
        env:
          RUSTY_GRID_SKIP_FEAT3_OS_ISOLATION_STEP8: ${{ matrix.os == 'windows-latest' && '1' || '' }}
        run: python scripts/ci_heartbeat.py --log "${{ runner.temp }}/workspace-tests.log" --interval 60 -- cargo test --workspace --locked --no-fail-fast
      - name: Diagnostics after the workspace tests (process tree, memory, output tail)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "== processes, oldest first (PID, parent PID, working set MB, start, name, command line)"
          Get-CimInstance Win32_Process | Sort-Object CreationDate | ForEach-Object {
            $cmd = if ($_.CommandLine) { $_.CommandLine.Substring(0, [Math]::Min(220, $_.CommandLine.Length)) } else { '' }
            '{0,7} {1,7} {2,6} {3:HH:mm:ss} {4,-28} {5}' -f $_.ProcessId, $_.ParentProcessId, [Math]::Round($_.WorkingSetSize / 1MB), $_.CreationDate, $_.Name, $cmd
          }
          Write-Host "== memory (MB)"
          $os = Get-CimInstance Win32_OperatingSystem
          'physical: {0} free of {1}; commit: {2} free of {3}' -f [Math]::Round($os.FreePhysicalMemory / 1KB), [Math]::Round($os.TotalVisibleMemorySize / 1KB), [Math]::Round($os.FreeVirtualMemory / 1KB), [Math]::Round($os.TotalVirtualMemorySize / 1KB)
          Write-Host "== last 120 lines of the workspace test output"
          $log = Join-Path $env:RUNNER_TEMP 'workspace-tests.log'
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 120 } else { 'no output file (the step did not start)' }
      - name: Diagnostics after the workspace tests (process tree, memory, output tail)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          echo "== processes (PID, parent PID, elapsed, RSS KiB, command)"
          if [ "$RUNNER_OS" = Linux ]; then
            ps -eo pid,ppid,etime,rss,args --forest | cut -c1-260
          else
            ps -axo pid,ppid,etime,rss,command | cut -c1-260
          fi
          echo "== memory"
          if [ "$RUNNER_OS" = Linux ]; then free -m; else vm_stat; fi
          uptime
          echo "== last 120 lines of the workspace test output"
          tail -n 120 "$RUNNER_TEMP/workspace-tests.log" 2>/dev/null || echo "no output file (the step did not start)"
      # Design 0033 (FEAT-3b): the workspace run above is the restricted-userns case of
      # `ubuntu-latest` (AppArmor lets `unshare` succeed without capabilities); this run has the
      # restriction off, so the private network namespace and its id map are exercised too.
      - name: isolation tests with unprivileged user namespaces allowed
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          RUSTY_GRID_REQUIRE_USERNS=1 cargo test -p rusty_grid_worker --test test_feat3_os_isolation --locked -- --nocapture

  sec5-hardened-runner:
    name: sec5 hardened runner (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - run: cargo test -p rusty_grid_worker --test test_sec5_hardened_runner --locked
      - run: cargo test -p rusty_grid_worker --test test_sec5_hardened_runner --features 3d --locked

  launcher-scripts:
    name: launcher scripts (${{ matrix.os }})
    if: github.event_name != 'schedule'
    # tests/test_launcher_scripts.py globs the whole checkout, target/ included, and gets slow once a
    # target/ directory exists. Keep cargo and rust-cache out of this job so that the script always runs
    # without any build: it runs the launchers against fake binaries.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: python3 tests/test_launcher_scripts.py
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # The launchers must work with macOS's own /bin/bash 3.2: run them with it, not with a newer
            # Homebrew bash that may come first on the runner's PATH.
            export PATH="/bin:$PATH"
          fi
          bash -c 'echo "bash $BASH_VERSION ($(command -v bash))"'
          python3 --version
          python3 tests/test_launcher_scripts.py

  agent-bridge:
    # The bridge also runs on the owner's Windows machine, and this is the only check of that path.
    name: agent bridge (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check websockets
      - run: python tests/test_agent_bridge.py
      - run: python tests/test_ci_push_runs.py
      - run: python tests/test_launcher_scripts.py
      - run: python tests/test_m1_challenger_hygiene.py
      - run: python tests/test_release_skew.py
      - run: python tests/test_bench_grid.py
      - run: python -B benchmarks/grid/test_bench_shard.py
      - run: python tests/test_scale_harness.py
      - run: python tests/test_bench_sweep.py
      - run: python tests/test_campaign_driver.py
      - run: python tests/test_endurance_harness.py
      - run: python tests/test_study_timer.py
      - name: run agent mesh test suite
        run: python tests/run_mesh_simulation_tests.py

  release-skew:
    # PROTO-2 (design 0076 D2) & PROTO-5 (design 0083): test both the newest release and the pinned
    # release one protocol back (PREVIOUS_PROTOCOL_RELEASE) against the pull request's build, in three
    # pairs on loopback. The expected verdict of each pair follows from the two builds' protocol
    # constants and the one-version window (design 0083); a pair that differs from it fails, as does
    # a refusal that prints no version error. Not a required check.
    name: release skew (ubuntu-latest)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # PROTO-5 (design 0083): pinned release one protocol back (protocol 9 while CURRENT=10, MIN=9).
      # Move this pin at each wire change.
      PREVIOUS_PROTOCOL_RELEASE: v0.3.0
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: cargo build --locked --bin oxideswarm
      - name: download releases and run the skew script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$latest_tag" ]; then
            echo "::notice::No release exists yet, so there is nothing to run against the pull request's build."
            echo "### Release skew" >> "$GITHUB_STEP_SUMMARY"
            echo "No release exists yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tags=("$latest_tag")
          if [ -n "${PREVIOUS_PROTOCOL_RELEASE:-}" ] && [ "${PREVIOUS_PROTOCOL_RELEASE}" != "${latest_tag}" ]; then
            tags+=("${PREVIOUS_PROTOCOL_RELEASE}")
          fi
          overall_rc=0
          for tag in "${tags[@]}"; do
            ver="${tag#v}"
            name="oxideswarm-${ver}-x86_64-unknown-linux-gnu"
            dl="$RUNNER_TEMP/release-dl/${tag}"
            out="$RUNNER_TEMP/release-bin/${tag}"
            mkdir -p "$dl" "$out"
            gh release download "$tag" -p "${name}.tar.gz" -p SHA256SUMS -D "$dl"
            (cd "$dl" && grep -F "  ${name}.tar.gz" SHA256SUMS | sha256sum -c -)
            tar -xzf "$dl/${name}.tar.gz" -C "$out"
            # The release's protocol constants give the expected verdict of each pair (design 0083).
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GH_REPO}/contents/crates/core/src/protocol.rs?ref=${tag}" > "$dl/protocol.rs"
            echo "Release ${tag} against the pull request build"
            if ! python3 -I scripts/release_skew.py "$out/${name}/oxideswarm" target/debug/oxideswarm \
              --release-protocol-rs "$dl/protocol.rs" --release-tag "$tag"; then
              overall_rc=1
            fi
          done
          exit "$overall_rc"

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; "unmaintained" notices (bincode 1.x, paste) are reported as warnings.
      - run: cargo audit

  # LV-5: the licences, banned crates and sources of the dependency tree against deny.toml, for the
  # workspace and for the separate fuzz/ workspace (its own Cargo.lock, same deny.toml). Advisories
  # stay with `cargo audit` above. Duplicate versions are warnings only.
  deny:
    name: cargo deny
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
      - name: workspace
        run: cargo deny --locked check licenses bans sources
      - name: fuzz workspace
        run: cargo deny --manifest-path fuzz/Cargo.toml --locked check licenses bans sources

  p2p-wan-relay:
    name: p2p wan relay (ignored)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo test -p rusty_grid_cli --test test_p2p_wan_fallback --locked -- --ignored

  # TEST-26 (design 0065 D4.2): short endurance transfer + 45-minute loopback soak on schedule and manual dispatch.
  endurance:
    name: endurance (loopback)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3cfd829add0beb9cf7406e52147d74ad3db19d01 # 1.96.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build oxideswarm release binary
        run: cargo build --release --locked --bin oxideswarm
      - name: Prepare isolated endurance work and output directories
        shell: bash
        run: |
          work_dir="${RUNNER_TEMP}/ox-endurance"
          if [ -d /mnt ]; then
            mnt_kb=$(df -Pk /mnt | awk 'NR==2 {print $4}')
            tmp_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
            if [ "${mnt_kb:-0}" -gt "${tmp_kb:-0}" ]; then
              work_dir="/mnt/ox-endurance"
              sudo mkdir -p "$work_dir"
              sudo chown "$(id -u):$(id -g)" "$work_dir"
            fi
          fi
          mkdir -p "$work_dir" "${RUNNER_TEMP}/endurance-results"
          df -h
          echo "ENDURANCE_WORK_DIR=${work_dir}" >> "$GITHUB_ENV"
          echo "ENDURANCE_RESULTS_DIR=${RUNNER_TEMP}/endurance-results" >> "$GITHUB_ENV"
      - name: Run short transfer suite (T1 1 GiB, T2 20k, T4, T6, T7, T8)
        shell: bash
        run: |
          python3 benchmarks/endurance/endurance.py transfer \
            --bin target/release/oxideswarm \
            --scenarios T1,T2,T4,T6,T7,T8 \
            --t1-sizes-gib 1 \
            --t2-files 20000 \
            --work-dir "$ENDURANCE_WORK_DIR" \
            --out "$ENDURANCE_RESULTS_DIR/transfer-loopback.json"
      - name: Run 45-minute loopback soak
        shell: bash
        run: |
          python3 benchmarks/endurance/endurance.py soak \
            --bin target/release/oxideswarm \
            --duration 45m \
            --fault-scale 0.25 \
            --load-scale 1.0 \
            --sample-interval 60s \
            --probe-interval 6s \
            --workers 3 \
            --slots 4 \
            --max-queue-size 64 \
            --work-dir "$ENDURANCE_WORK_DIR" \
            --out "$ENDURANCE_RESULTS_DIR/soak-45m-loopback.json"
      - name: Upload endurance JSON records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: endurance-records
          path: ${{ runner.temp }}/endurance-results
          if-no-files-found: warn

  # LV-1, LV-18: libFuzzer targets of fuzz/ (cargo-fuzz needs a nightly toolchain: dated, so that a
  # new nightly cannot turn CI red on an unchanged tree). Pull requests and pushes: 60 s per target;
  # the weekly schedule: 10 minutes per target. The inputs of fuzz/regressions/ run first. Since
  # LV-18 the fuzz crate also builds rusty_grid_master and rusty_grid_cli (with iroh), hence the
  # longer timeout.
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [inbound_frame, server_handshake, tree_manifest, aead_record, join_invite, store_journal, mcp_request_line]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CI-1: the nightly download failed once (run 44036878952); try it up to four times first, so
      # the action below finds the pinned toolchain installed. The date is unchanged.
      - name: pinned nightly toolchain (retried download)
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if rustup toolchain install nightly-2026-11-10 --profile minimal --no-self-update; then
              exit 0
            fi
            echo "toolchain download failed (attempt $attempt of 4)"
            sleep $((attempt * 15))
          done
          exit 1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-11-10
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          cache-on-failure: true
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-fuzz
      - name: lock file is current
        run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: regression inputs
        working-directory: fuzz
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} regressions/${{ matrix.target }} -- -runs=0
      - name: fuzz
        working-directory: fuzz
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=$FUZZ_SECONDS -max_len=4096
      - name: upload crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # LV-4 (design 0058 D2): Miri runs the unit tests of rusty_grid_core and reports undefined
  # behaviour in them, in the `unsafe` code they reach and in the dependencies they call. It uses
  # the dated nightly of the fuzz job. Not a required check: the owner decides that (LV-4).
  # MIRIFLAGS=-Zmiri-disable-isolation: a task carries its creation time (chrono::Utc::now), and
  # the wire layout and window tests read their recorded files; Miri refuses both under isolation.
  # Skipped, with #[cfg_attr(miri, ignore = "Miri: <reason>")] on each test, because Miri cannot
  # run C code or most calls into the operating system:
  #   - "ring detects CPU features in C and assembly": every test that computes an HMAC, an AEAD
  #     record or a cluster secret (most of cluster_auth, the MAC'd beacons of discovery,
  #     arbitrage, the AEAD tests of protocol, the Noise key files);
  #   - "sysinfo queries the host system": capability detection;
  #   - "opens a network socket": TCP transport and discovery probes;
  #   - "spawns a process": tool and Blender probes, the `git` check of the wire layout;
  #   - "creates and opens a FIFO": libc::mkfifo and O_NONBLOCK;
  #   - "too slow under the interpreter" and "asserts a wall-clock bound": BLAKE3 and manifest
  #     budgets over large inputs, multi-chunk blob transfer, the source scan of lib.rs.
  # Linux only: Miri has no kqueue, so on macOS every Tokio test stops at the runtime.
  miri:
    name: miri (rusty_grid_core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same retry as the fuzz job (CI-1).
      - name: pinned nightly toolchain with Miri (retried download)
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if rustup toolchain install nightly-2026-11-10 --profile minimal --component miri,rust-src --no-self-update; then
              exit 0
            fi
            echo "toolchain download failed (attempt $attempt of 4)"
            sleep $((attempt * 15))
          done
          exit 1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-11-10
          components: miri, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-on-failure: true
      - run: cargo miri setup
      - name: cargo miri test -p rusty_grid_core --lib
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo miri test -p rusty_grid_core --lib --locked

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly run so that RustSec advisories published against an unchanged Cargo.lock still show up.
  # Only the audit job runs on the schedule.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# The toolchain is pinned (`dtolnay/rust-toolchain@<version>`) so that a new stable release and its
# new lints cannot turn CI red on an unchanged tree. Bump it in every job at once, deliberately,
# after running `cargo clippy --workspace --all-targets -- -D warnings` locally on the new version.

jobs:
  fmt:
    name: rustfmt
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Each OS compiles its own cfg-gated code (process groups, Job Objects, PR_SET_PDEATHSIG).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: master compiles without default features (dashboard, p2p)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check -p rusty_grid_master --no-default-features --locked

  test:
    # Unit tests only (`ox-mode test quick`). The full `cargo test --workspace` suite is slow and
    # includes timing-sensitive stress and P2P tests, so it stays a local check.
    name: unit tests (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; "unmaintained" notices (bincode 1.x, paste) are reported as warnings.
      - run: cargo audit

name: Scorecard

# OpenSSF Scorecard (LV-5, design 0058): scores the repository's supply-chain practices (pinned
# actions, token permissions, fuzzing, signed releases, branch protection, ...). It runs weekly and
# on every push to master, uploads its SARIF to the code-scanning dashboard and publishes the result
# to api.scorecard.dev for the README badge. Scorecard supports the default branch only, so a manual
# run on another branch is skipped.
#
# The Scorecard API accepts published results only from a workflow without workflow-level env,
# defaults or write permissions, where only the analysis job has `id-token: write` and that job uses
# only actions/checkout, actions/upload-artifact, github/codeql-action/upload-sarif and
# ossf/scorecard-action (no `run` steps). Keep it so.

on:
  push:
    branches: [master]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    if: github.event.repository.default_branch == github.ref_name
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the results published to api.scorecard.dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

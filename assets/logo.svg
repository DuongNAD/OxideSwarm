<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" role="img" aria-labelledby="title">
  <title id="title">OxideSwarm</title>
  <style>
    .shell { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; stroke-linejoin: round; }
    .swarm { fill: #F59E0B; }
    .word { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 60px; font-weight: 600; letter-spacing: -1px; }
    .oxide { fill: #F59E0B; }
    .rest { fill: #0F172A; }
    @media (prefers-color-scheme: dark) {
      .rest { fill: #F1F5F9; }
      .shell { stroke: #64748B; }
    }
  </style>
  <g transform="translate(-20,-10)">
    <path class="shell" d="M66,95 L76,85 L88,97 L100,83 L112,97 L124,85 L134,95 C138,115 134,152 100,152 C66,152 62,115 66,95 Z"/>
    <g transform="translate(-6,-14) rotate(-14,100,95)">
      <path class="shell" d="M66,95 L76,85 L88,97 L100,83 L112,97 L124,85 L134,95 C130,67 116,59 100,59 C84,59 70,67 66,95 Z"/>
    </g>
    <g class="swarm">
      <circle cx="120" cy="70" r="6"/>
      <circle cx="132" cy="58" r="4.5"/>
      <circle cx="142" cy="49" r="3.5"/>
      <circle cx="110" cy="60" r="3"/>
    </g>
  </g>
  <text class="word" x="160" y="116"><tspan class="oxide">Oxide</tspan><tspan class="rest">Swarm</tspan></text>
</svg>

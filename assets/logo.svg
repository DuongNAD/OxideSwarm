<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.8" />
    </linearGradient>

    <!-- Rust Flame Gradient -->
    <linearGradient id="oxide-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff6b35" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Metal / Silver Gradient -->
    <linearGradient id="swarm-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Cyan Mesh Glow -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .mono-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
    }
  </style>

  <!-- Outer Card Background -->
  <rect x="4" y="4" width="912" height="252" rx="20" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.8" />
  <rect x="4" y="4" width="912" height="252" rx="20" fill="url(#grid-dots)" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="140" cy="130" r="85" fill="#f97316" fill-opacity="0.12" filter="url(#glow-soft)" />
  <circle cx="140" cy="130" r="50" fill="#00f2fe" fill-opacity="0.08" filter="url(#glow-soft)" />

  <!-- ==================== SWARM MESH ICON ==================== -->
  <g transform="translate(140, 130)">
    <!-- Outer Gear / Hexagon Frame -->
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="0,-68 59,-34 59,34 0,68 -59,34 -59,-34" fill="none" stroke="#f97316" stroke-width="2" stroke-opacity="0.4" />

    <!-- Gear Teeth Notches (Rust Core) -->
    <g stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <line x1="0" y1="-72" x2="0" y2="-82" />
      <line x1="62" y1="-36" x2="71" y2="-41" />
      <line x1="62" y1="36" x2="71" y2="41" />
      <line x1="0" y1="72" x2="0" y2="82" />
      <line x1="-62" y1="36" x2="-71" y2="41" />
      <line x1="-62" y1="-36" x2="-71" y2="-41" />
    </g>

    <!-- Interconnecting Swarm Network Lines -->
    <g stroke-linecap="round">
      <!-- Master to Workers -->
      <line x1="0" y1="0" x2="0" y2="-52" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8" />
      <line x1="0" y1="0" x2="48" y2="-24" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.8" />
      <line x1="0" y1="0" x2="48" y2="28" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.8" />
      <line x1="0" y1="0" x2="0" y2="52" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.8" />
      <line x1="0" y1="0" x2="-48" y2="28" stroke="#ec4899" stroke-width="2.5" stroke-opacity="0.8" />
      <line x1="0" y1="0" x2="-48" y2="-24" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.8" />

      <!-- P2P Inter-Worker Ring Lines -->
      <polygon points="0,-52 48,-24 48,28 0,52 -48,28 -48,-24" fill="#0f172a" fill-opacity="0.6" stroke="#475569" stroke-width="1.5" stroke-dasharray="2,3" />
    </g>

    <!-- Satellite Worker Nodes -->
    <!-- Node 1: Apple Silicon Mac (Top) -->
    <circle cx="0" cy="-52" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="0" cy="-52" r="3" fill="#38bdf8" filter="url(#glow-cyan)" />

    <!-- Node 2: Windows GPU Rig (Top Right) -->
    <circle cx="48" cy="-24" r="7.5" fill="#0f172a" stroke="#10b981" stroke-width="2.5" />
    <circle cx="48" cy="-24" r="3.5" fill="#10b981" />

    <!-- Node 3: Linux Cluster (Bottom Right) -->
    <circle cx="48" cy="28" r="6.5" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" />
    <circle cx="48" cy="28" r="3" fill="#f59e0b" />

    <!-- Node 4: Mobile Android S24 (Bottom) -->
    <circle cx="0" cy="52" r="7" fill="#0f172a" stroke="#a855f7" stroke-width="2.5" />
    <circle cx="0" cy="52" r="3" fill="#a855f7" />

    <!-- Node 5: Edge Node (Bottom Left) -->
    <circle cx="-48" cy="28" r="6.5" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <circle cx="-48" cy="28" r="2.8" fill="#ec4899" />

    <!-- Node 6: Cloud Worker (Top Left) -->
    <circle cx="-48" cy="-24" r="6.5" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <circle cx="-48" cy="-24" r="2.8" fill="#06b6d4" />

    <!-- Central Master Coordinator Node -->
    <circle cx="0" cy="0" r="18" fill="#1e1b4b" stroke="url(#oxide-grad)" stroke-width="3" filter="url(#glow-orange)" />
    <circle cx="0" cy="0" r="11" fill="url(#oxide-grad)" />
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
  </g>

  <!-- ==================== BRANDING & TYPOGRAPHY ==================== -->
  <g transform="translate(255, 46)">
    <!-- Protocol Badge / Tagline -->
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="370" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="12" cy="12" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="16" class="mono-label" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1">
        ZERO-BROKER P2P GRID · QUIC &amp; TOKIO
      </text>
    </g>

    <!-- Main Title: OXIDE SWARM -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" class="brand-title" font-size="52" fill="url(#oxide-grad)" filter="drop-shadow(0 2px 12px rgba(249,115,22,0.3))">
        OXIDE<tspan fill="url(#swarm-grad)">SWARM</tspan>
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(2, 98)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8">
        High-Performance, Zero-Broker Distributed Computing Grid for Heterogeneous Clusters
      </text>
    </g>

    <!-- Platform Capability Pills -->
    <g transform="translate(0, 126)">
      <!-- Pill 1: macOS -->
      <g transform="translate(0, 0)">
        <rect width="138" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#38bdf8" />
        <text x="22" y="17" class="badge-text" fill="#cbd5e1">macOS (Apple Silicon)</text>
      </g>

      <!-- Pill 2: Windows GPU -->
      <g transform="translate(146, 0)">
        <rect width="144" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#10b981" />
        <text x="22" y="17" class="badge-text" fill="#cbd5e1">Windows (GPU Stealth)</text>
      </g>

      <!-- Pill 3: Android -->
      <g transform="translate(298, 0)">
        <rect width="132" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#a855f7" />
        <text x="22" y="17" class="badge-text" fill="#cbd5e1">Android (ARM64 JNI)</text>
      </g>

      <!-- Pill 4: Linux Server -->
      <g transform="translate(438, 0)">
        <rect width="102" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#f59e0b" />
        <text x="22" y="17" class="badge-text" fill="#cbd5e1">Linux Server</text>
      </g>
    </g>
  </g>
</svg>

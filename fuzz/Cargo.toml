[package]
name = "rusty_grid_fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "cargo-fuzz targets for the parsers of untrusted bytes (LV-1, LV-18); not part of the workspace"

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
rusty_grid_core = { path = "../crates/core", default-features = false }
# `store_journal`: the task store readers, exposed by the `fuzzing` feature (LV-18).
rusty_grid_master = { path = "../crates/master", default-features = false, features = ["fuzzing"] }
# `join_invite`: the join token, invite and `invite.oxs` parsers (all public); `mcp_request_line`:
# the MCP line reader (`#[doc(hidden)] pub`).
rusty_grid_cli = { path = "../crates/cli" }
tokio = { version = "1.40", features = ["rt", "time", "io-util", "test-util"] }
bytes = "1.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
serde_json = "1.0"

[dev-dependencies]
# `gen_seeds` only: a cheap-cost `invite.oxs` seed (versions as in `rusty_grid_cli`).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
ring = "0.17"

[[bin]]
name = "inbound_frame"
path = "fuzz_targets/inbound_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_handshake"
path = "fuzz_targets/server_handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tree_manifest"
path = "fuzz_targets/tree_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aead_record"
path = "fuzz_targets/aead_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "join_invite"
path = "fuzz_targets/join_invite.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_journal"
path = "fuzz_targets/store_journal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_request_line"
path = "fuzz_targets/mcp_request_line.rs"
test = false
doc = false
bench = false

[workspace]

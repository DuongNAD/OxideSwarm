# First-wave 0.4.7 / 0.4.8 shared team plan (design 0111, D7).
# Generated from open draft PRs in merge order: 477, 479, 478, 481, 475, 480, 482, 484, 483.

[project]
base = "master"
contracts = [
    "crates/core/src/protocol.rs",
    "docs/reference.md",
]

# One verify profile per OS that CI runs (.github/workflows/ci.yml).
[profile.ci-linux]
command = ["cargo", "test", "--workspace", "--lib", "--locked"]
require = ["os:linux", "tool:cargo"]

[profile.ci-macos]
command = ["cargo", "test", "--workspace", "--lib", "--locked"]
require = ["os:macos", "tool:cargo"]

[profile.ci-windows]
command = ["cargo", "test", "--workspace", "--lib", "--locked"]
require = ["os:windows", "tool:cargo"]


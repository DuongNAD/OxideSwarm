[package]
name = "agent_mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Cross-Platform Coding Agent Communication Framework PoC"

[[bin]]
name = "agent-mesh"
path = "src/main.rs"

[features]
default = []
# Opt-in 3D generation and auto-rigging worker support for agent_mesh integration tests (FEAT-11 / D6).
3d = ["dep:rusty_grid_worker", "rusty_grid_worker/3d"]

[dependencies]
rusty_grid_core = { workspace = true }
rusty_grid_master = { workspace = true }
rusty_grid_worker = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["codec"] }
bytes = { workspace = true }
futures = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true, features = ["cors"] }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
clap = { workspace = true, features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
sysinfo = { workspace = true }
ring = "0.17"
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
# killpg() for the mesh executor's process-group kill (already in Cargo.lock via tokio)
libc = "0.2"

[dev-dependencies]
rusty_grid_worker = { workspace = true }
tempfile = "3"
reqwest = { workspace = true }

[[test]]
name = "test_ecosystem_convergence"
path = "../../tests/test_ecosystem_convergence.rs"

[package]
name = "rusty_grid_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxideswarm"
path = "src/main.rs"

[[bin]]
name = "rusty-grid"
path = "src/bin/rusty_grid.rs"

[[bin]]
name = "ox-mode"
path = "src/bin/ox_mode.rs"

[dependencies]
rusty_grid_core = { workspace = true }
rusty_grid_master = { workspace = true }
rusty_grid_worker = { workspace = true }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
futures = { workspace = true }

[[test]]
name = "e2e_cluster"
path = "../../tests/e2e_cluster.rs"

[[test]]
name = "m5_challenger_1_stress"
path = "../../tests/m5_challenger_1_stress.rs"

[[test]]
name = "m6_challenger_1_stress"
path = "../../tests/m6_challenger_1_stress.rs"

[[test]]
name = "m6_challenger_2_stress"
path = "../../tests/m6_challenger_2_stress.rs"

[[test]]
name = "windows_cross_compile_test"
path = "../../tests/windows_cross_compile_test.rs"

[[test]]
name = "workflow_modes_test"
path = "../../tests/workflow_modes_test.rs"

[[test]]
name = "discovery_integration"
path = "../../tests/discovery_integration.rs"

[[test]]
name = "test_p2p_wan_fallback"
path = "../../tests/test_p2p_wan_fallback.rs"

[[test]]
name = "test_m2_identity_scripts"
path = "../../tests/test_m2_identity_scripts.rs"




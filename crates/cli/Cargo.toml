[package]
name = "rusty_grid_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OxideSwarm command line: master, worker, submit, doctor and MCP server"

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxideswarm"
path = "src/main.rs"

[[bin]]
name = "rusty-grid"
path = "src/bin/rusty_grid.rs"

[[bin]]
name = "ox-mode"
path = "src/bin/ox_mode.rs"

[dependencies]
rusty_grid_core = { workspace = true }
rusty_grid_master = { workspace = true }
rusty_grid_worker = { workspace = true }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
toml = { workspace = true }
chrono = { workspace = true }
sysinfo = { workspace = true }
ignore = "0.4"
base64 = "0.23"

[features]
# Workers of this binary can compute on the GPU (Metal, Vulkan, DirectX 12) and advertise it:
#   cargo build --release --bin oxideswarm --features gpu-wgpu
# Without it `--gpu` is refused (no GPU is advertised) and only `--simulate-gpu` is available.
gpu-wgpu = ["rusty_grid_worker/gpu-wgpu"]
# Opt-in Generative 3D (`gen3d`) and skeletal auto-rigging (`autorig`) worker execution support.
3d = ["rusty_grid_worker/3d"]

[dev-dependencies]
rusty_grid_master = { workspace = true, features = ["test-hooks"] }
tempfile = "3"
futures = { workspace = true }
agent_mesh = { workspace = true }
bytes = { workspace = true }

[[test]]
name = "test_3d_autorig_pipeline"
path = "../../tests/test_3d_autorig_pipeline.rs"
required-features = ["3d"]


[package]
name = "rusty_grid_core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Wire protocol, tasks, capabilities and discovery shared by every OxideSwarm component"

[dependencies]
tokio = { workspace = true, features = ["sync", "io-util", "macros", "process", "rt-multi-thread", "time", "net"] }
tokio-util = { workspace = true, features = ["codec"] }
bytes = { workspace = true }
futures = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bincode = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
sysinfo = { workspace = true }
iroh = { workspace = true, optional = true }

# Cluster authentication (HMAC-SHA256, CSPRNG, Noise IK v3) and TCP socket options.
ring = "0.17"
snow = { version = "0.10", features = ["risky-raw-split"] }
socket2 = { version = "0.6", features = ["all"] }

# Content-addressed blob ids (already in Cargo.lock via iroh).
blake3 = "1.8"

[target.'cfg(unix)'.dependencies]
# killpg() for probe process groups (already in Cargo.lock via tokio)
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects for probe process trees (already in Cargo.lock via tokio / mio)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading"] }

[features]
default = ["p2p"]
p2p = ["dep:iroh"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"

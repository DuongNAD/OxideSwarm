[package]
name = "oxideswarm_tray"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "OxideSwarm contributor tray app: watches worker, exposes Pause/Resume/Limits, and pauses during full-screen programs"

[lints]
workspace = true

[lib]
name = "oxideswarm_tray"
path = "src/lib.rs"

[[bin]]
name = "oxideswarm-tray"
path = "src/main.rs"

[dependencies]
rusty_grid_worker = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "process", "sync", "signal"] }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }
muda = { version = "0.20", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
uuid = { workspace = true, features = ["v4"] }

[package]
name = "rusty_grid_worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rusty_grid_core = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["codec"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
getrandom = "0.4"
tempfile = "3"
sysinfo = { workspace = true }
iroh = { workspace = true, optional = true }
wgpu = { version = "22", optional = true }
pollster = { version = "0.3", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }

[features]
default = ["p2p"]
p2p = ["dep:iroh", "rusty_grid_core/p2p"]
gpu-wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dev-dependencies]
rusty_grid_master = { path = "../master" }
tempfile = "3"

[[test]]
name = "m3_execution"
path = "../../tests/m3_execution.rs"

[[test]]
name = "m3_challenger_1_stress"
path = "../../tests/m3_challenger_1_stress.rs"

[[test]]
name = "m3_challenger_2_stress"
path = "../../tests/m3_challenger_2_stress.rs"

[[test]]
name = "gpu_wgpu_compute_test"
path = "../../tests/gpu_wgpu_compute_test.rs"

[[test]]
name = "gpu_wgpu_adversarial_test"
path = "../../tests/gpu_wgpu_adversarial_test.rs"



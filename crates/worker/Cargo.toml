[package]
name = "rusty_grid_worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OxideSwarm worker: task runner, sandbox, blob cache and optional GPU compute"

[dependencies]
rusty_grid_core = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["codec"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
getrandom = "0.4"
tempfile = "3"
sysinfo = { workspace = true }
iroh = { workspace = true, optional = true }
wgpu = { version = "22", optional = true }
pollster = { version = "1.0", optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }

[target.'cfg(unix)'.dependencies]
# killpg() / setpriority() for task process groups (already in Cargo.lock via tokio)
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects for task process trees (already in Cargo.lock via tokio / mio)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }

[features]
default = ["p2p"]
p2p = ["dep:iroh", "rusty_grid_core/p2p"]
gpu-wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
3d = []

[dev-dependencies]
rusty_grid_master = { path = "../master" }
tempfile = "3"

[[example]]
name = "gemm_bench"
required-features = ["gpu-wgpu"]


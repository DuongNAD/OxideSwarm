[package]
name = "rusty_grid_master"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rusty_grid_core = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["codec"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tempfile = "3"
sysinfo = { workspace = true }
iroh = { workspace = true, optional = true }
futures = { workspace = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[features]
default = ["p2p", "dashboard"]
p2p = ["dep:iroh", "rusty_grid_core/p2p"]
dashboard = ["dep:axum", "dep:tower-http"]

[dev-dependencies]
rusty_grid_worker = { path = "../worker" }
futures = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
bincode = { workspace = true }

